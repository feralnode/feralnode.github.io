<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a09">
<meta name="description" content="Sam Mayahi — Software Testing and Test Automation. Quietly unconventional. Connect with Feral Node.">
<title>Sam Mayahi · Feral Node</title>
<style>
:root{color-scheme:dark;--bg:#090a09;--panel:#111311;--ivory:#f1efe7;--muted:#a9ada4;--line:#343832;--accent:#d9dfd2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#242922 0%,var(--bg) 55%);color:var(--ivory);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;padding:24px}
main{width:100%;max-width:430px}
.card{background:rgba(17,19,17,.94);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 70px #0008}
.brand{display:flex;align-items:center;gap:17px;margin-bottom:26px}
.logo{width:84px;height:84px;flex:none;display:block;object-fit:contain;border-radius:14px}
.kicker{font-size:.69rem;letter-spacing:.23em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}
h1{font-size:clamp(1.65rem,7vw,2.05rem);letter-spacing:.09em;margin:0;font-weight:750}
.role{color:#d4d8ce;line-height:1.6;font-size:.88rem;margin:8px 0 0}
.rule{height:1px;background:var(--line);margin:22px 0}
.tagline{font-size:1rem;line-height:1.65;margin:0 0 7px}
.location{color:var(--muted);font-size:.88rem;margin:0}
.actions{display:grid;gap:10px;margin-top:25px}
a.button{display:flex;justify-content:center;align-items:center;gap:10px;text-decoration:none;font-size:.95rem;font-weight:650;padding:14px 16px;border-radius:12px;border:1px solid #656b60;color:var(--ivory);transition:transform .15s,background .15s}
a.button:hover{transform:translateY(-1px);background:#20241f}
a.primary{background:var(--ivory);color:#10120f;border-color:var(--ivory)}
a.primary:hover{background:#d9ddd3}
.icon{width:19px;height:19px;display:inline-block}
footer{text-align:center;color:#747b70;font-size:.68rem;letter-spacing:.2em;margin:20px 0 0}
.note{font-size:.72rem;color:#8f958a;text-align:center;line-height:1.5;margin:15px 0 0}
@media(max-width:380px){body{padding:14px}.card{padding:22px}.logo{width:70px;height:70px}.brand{gap:13px}}
</style>
</head>
<body>
<main>
<section class="card" aria-label="Sam Mayahi digital contact card">
  <div class="brand">
    <img class="logo" src="./feral-node-fox.png" alt="Feral Node fox emblem">
    <div>
      <p class="kicker">Independent mind · Reliable systems</p>
      <h1>SAM MAYAHI</h1>
      <p class="role">SOFTWARE TESTING<br>TEST AUTOMATION</p>
    </div>
  </div>
  <div class="rule"></div>
  <p class="tagline">Quietly unconventional.</p>
  <p class="location">Göteborg, Sweden</p>
  <div class="actions">
    <a class="button primary" href="sam-mayahi.vcf" download>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></svg>
      Save contact
    </a>
    <a class="button" href="https://www.linkedin.com/in/sam-mayahi-50043a443/" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.37 4.28 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0Z"/></svg>
      Connect on LinkedIn
    </a>
    <a class="button" href="https://github.com/feralnode" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.08c-3.1.67-3.75-1.32-3.75-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.02-.7.08-.69.08-.69 1.12.08 1.71 1.15 1.71 1.15 1 1.71 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.48-.28-5.09-1.24-5.09-5.53 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3.0 0 4.3-2.61 5.25-5.1 5.52.4.35.76 1.03.76 2.08V22c0 .29.2.63.76.52A11.1 11.1 0 0 0 12 .9Z"/></svg>
      Explore my GitHub
    </a>
    <a class="button" href="mailto:sam.mayahi@iths.se">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
      Email me
    </a>
  </div>
</section>
<footer>FERAL NODE</footer>
<p class="note">Tap “Save contact” to add my details to your phone.</p>
</main>
</body>
</html>
